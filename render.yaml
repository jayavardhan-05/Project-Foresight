services:
  # Backend Service (FastAPI + PyTorch + Qiskit)
  - type: web
    name: foresight-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: "8000"

  # Frontend Static Site (React SPA)
  - type: web
    name: foresight-frontend
    runtime: static
    buildCommand: cd foresight_ui && npm install && npm run build
    staticPublishPath: ./foresight_ui/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: foresight-backend
          property: host
